<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">CryptPaste interface preview</title>
  <desc id="desc">Dark CryptPaste interface with a note form, password fields and a create button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a2a"/>
      <stop offset="1" stop-color="#1b2740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="920" fill="url(#bg)"/>
  <circle cx="1240" cy="80" r="260" fill="#67e8f9" opacity=".06"/>
  <circle cx="120" cy="850" r="320" fill="#a78bfa" opacity=".05"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="120" y="110" fill="#f8fafc" font-size="38" font-weight="750">CryptPaste</text>
    <text x="120" y="150" fill="#94a3b8" font-size="18">Secure short text sharing</text>
    <rect x="1200" y="78" width="96" height="46" rx="23" fill="#24324c" stroke="#40516f"/>
    <circle cx="1223" cy="101" r="13" fill="#f8fafc"/>
    <text x="1250" y="108" fill="#cbd5e1" font-size="15">Theme</text>

    <rect x="270" y="205" width="900" height="600" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
    <text x="330" y="285" fill="#101827" font-size="28" font-weight="700">New encrypted note</text>
    <text x="330" y="322" fill="#64748b" font-size="16">Your text is encrypted in this browser before upload.</text>

    <text x="330" y="380" fill="#334155" font-size="15" font-weight="650">Text</text>
    <rect x="330" y="398" width="780" height="128" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="354" y="438" fill="#94a3b8" font-size="16">Paste a short secret note here…</text>
    <text x="1015" y="500" fill="#94a3b8" font-size="13">0 / 32 KiB</text>

    <text x="330" y="578" fill="#334155" font-size="15" font-weight="650">Password</text>
    <rect x="330" y="596" width="370" height="58" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="354" y="632" fill="#94a3b8" font-size="16">Enter a strong password</text>
    <text x="740" y="578" fill="#334155" font-size="15" font-weight="650">Expires</text>
    <rect x="740" y="596" width="370" height="58" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="764" y="632" fill="#334155" font-size="16">1 hour</text>
    <path d="m1075 621 8 8 8-8" fill="none" stroke="#64748b" stroke-width="2"/>

    <rect x="330" y="704" width="780" height="58" rx="12" fill="url(#accent)"/>
    <text x="720" y="740" fill="#101827" font-size="17" font-weight="750" text-anchor="middle">Encrypt &amp; create link</text>
  </g>
</svg>
