name: Publish CryptPaste Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify prebuilt static entrypoint
        run: test -f frontend/dist/index.html
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: frontend/dist
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v1
